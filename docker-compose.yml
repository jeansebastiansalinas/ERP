version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: erp_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
